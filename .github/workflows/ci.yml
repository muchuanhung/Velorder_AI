name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-unit:
    name: Web 型別檢查與單元測試
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: strava-route-system
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: strava-route-system/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: strava-route-system/.nvmrc
          cache: pnpm
          cache-dependency-path: strava-route-system/pnpm-lock.yaml

      # 只裝 web 及其 workspace 依賴，略過 docs
      - run: pnpm install --frozen-lockfile --filter web...

      - name: 型別檢查
        run: pnpm --filter web exec tsc --noEmit

      # unit project 是純函式測試，不需要瀏覽器與 server
      - name: 單元測試
        run: pnpm --filter web test:unit

  api-test:
    name: API lint、測試與 MySQL migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: strava-route-system/apps/api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: routecast
          MYSQL_USER: routecast
          MYSQL_PASSWORD: routecast
          MYSQL_ROOT_PASSWORD: routecast-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroutecast -proutecast"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql+pymysql://routecast:routecast@127.0.0.1:3306/routecast?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: strava-route-system/apps/api/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      # 測試用 SQLite + 假的 Firebase verifier + 本機/moto 儲存，不需要任何雲端憑證
      - name: 測試
        run: pytest

      - name: MySQL migration 升降級與 drift 檢查
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
